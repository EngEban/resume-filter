# ============================================================
# ResumeFilter - Docker Compose (Development / Local)
# ============================================================
# Run from the project root:
#   docker-compose -f docker/docker-compose.yml up -d
# ============================================================

services:

  # ============================================================
  # PostgreSQL - Main Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: rf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rf_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rf_db}
      APP_DB_USER: ${APP_DB_USER:-rf_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-rf_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-rls.sql:/docker-entrypoint-initdb.d/01-rls.sql:ro
      - ./postgres/02-create-app-role.sh:/docker-entrypoint-initdb.d/02-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-rf_app} -d ${POSTGRES_DB:-rf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rf_network

  # ============================================================
  # Redis - Broker + Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: rf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rf_network

  # ============================================================
  # SeaweedFS - Object Storage (S3-compatible)
  # ============================================================
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: rf_seaweedfs
    restart: unless-stopped
    command: server -s3 -dir=/data -s3.port=8333
    ports:
      - "8333:8333"    # S3 API
      - "9333:9333"    # Master UI
      - "8888:8888"    # Filer UI
    volumes:
      - seaweedfs_data:/data
    networks:
      - rf_network

  # ============================================================
  # FastAPI + NiceGUI - Web Service
  # ============================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: rf_api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${APP_DB_USER:-rf_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-rf_pass}
      DATABASE_URL: postgresql+asyncpg://rf_app:rf_pass@postgres:5432/rf_db
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    volumes:
      - ../app:/app/app
      - ../ui:/app/ui
      - ../alembic:/app/alembic
      - ../scripts:/app/scripts
    networks:
      - rf_network

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: rf_migrate
    restart: "no"
    command: ["sh", "-c", "python scripts/wait_for_db.py && alembic upgrade head"]
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rf_pass}
      DATABASE_URL: postgresql+asyncpg://rf_user:rf_pass@postgres:5432/rf_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
      - ../scripts:/app/scripts
    networks:
      - rf_network

  # ============================================================
  # Celery Worker - Batch Processing
  # ============================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: rf_worker
    restart: unless-stopped
    command: >
      sh -c "
      python scripts/wait_for_db.py &&
      celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
      "
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${APP_DB_USER:-rf_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-rf_pass}
      DATABASE_URL: postgresql+asyncpg://rf_app:rf_pass@postgres:5432/rf_db
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      - ../ui:/app/ui
      - ../scripts:/app/scripts
    networks:
      - rf_network

  # ============================================================
  # Flower - Celery Monitoring
  # ============================================================
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: rf_flower
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${APP_DB_USER:-rf_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-rf_pass}
      DATABASE_URL: postgresql+asyncpg://rf_app:rf_pass@postgres:5432/rf_db
    depends_on:
      - redis
      - worker
    networks:
      - rf_network


# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    name: rf_postgres_data
  redis_data:
    name: rf_redis_data
  seaweedfs_data:
    name: rf_seaweedfs_data


# ============================================================
# Networks
# ============================================================
networks:
  rf_network:
    name: rf_network
    driver: bridge