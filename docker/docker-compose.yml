# ============================================================
# ResumeFilter - Docker Compose (Development / Local)
# ============================================================
# Run from the project root:
#   docker-compose -f docker/docker-compose.yml up -d
# ============================================================

services:

  # ============================================================
  # PostgreSQL - Main Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: rf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-rf_db}
      RF_APP_PASSWORD: ${RF_APP_PASSWORD:?RF_APP_PASSWORD must be set}
      RF_WORKER_PASSWORD: ${RF_WORKER_PASSWORD:?RF_WORKER_PASSWORD must be set}
      RF_MIGRATOR_PASSWORD: ${RF_MIGRATOR_PASSWORD:?RF_MIGRATOR_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-rls.sql:/docker-entrypoint-initdb.d/01-rls.sql:ro
      - ./postgres/02-create-app-role.sh:/docker-entrypoint-initdb.d/02-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rf_user} -d ${POSTGRES_DB:-rf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rf_network

  # Idempotent role provisioning for new and existing databases. This uses
  # the bootstrap connection only and is not an application runtime.
  role-provision:
    image: postgres:16-alpine
    container_name: rf_role_provision
    restart: "no"
    command: ["sh", "/usr/local/bin/02-create-app-role.sh"]
    env_file:
      - ../.env
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-rf_db}
      RF_APP_PASSWORD: ${RF_APP_PASSWORD:?RF_APP_PASSWORD must be set}
      RF_WORKER_PASSWORD: ${RF_WORKER_PASSWORD:?RF_WORKER_PASSWORD must be set}
      RF_MIGRATOR_PASSWORD: ${RF_MIGRATOR_PASSWORD:?RF_MIGRATOR_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/02-create-app-role.sh:/usr/local/bin/02-create-app-role.sh:ro
    networks:
      - rf_network

  # ============================================================
  # Redis - Broker + Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: rf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rf_network

  # ============================================================
  # SeaweedFS - Object Storage (S3-compatible)
  # ============================================================
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: rf_seaweedfs
    restart: unless-stopped
    command: server -s3 -dir=/data -s3.port=8333
    ports:
      - "8333:8333"    # S3 API
      - "9333:9333"    # Master UI
      - "8888:8888"    # Filer UI
    volumes:
      - seaweedfs_data:/data
    networks:
      - rf_network

  # ============================================================
  # FastAPI API Web Service
  # ============================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: rf_api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: rf_app
      POSTGRES_PASSWORD: ${RF_APP_PASSWORD:?RF_APP_PASSWORD must be set}
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL must be set}
      RF_APP_PASSWORD: ""
      RF_WORKER_PASSWORD: ""
      RF_MIGRATOR_PASSWORD: ""
      WORKER_DATABASE_URL: ""
      MIGRATOR_DATABASE_URL: ""
    depends_on:
      runtime-grants:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
      - ../scripts:/app/scripts
    networks:
      - rf_network

  # React + Vite production frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: rf_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - rf_network

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: rf_migrate
    restart: "no"
    command: ["sh", "-c", "python scripts/wait_for_db.py && alembic upgrade head"]
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: rf_migrator
      POSTGRES_PASSWORD: ${RF_MIGRATOR_PASSWORD:?RF_MIGRATOR_PASSWORD must be set}
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?MIGRATOR_DATABASE_URL must be set}
      RF_APP_PASSWORD: ""
      RF_WORKER_PASSWORD: ""
      RF_MIGRATOR_PASSWORD: ""
      API_DATABASE_URL: ""
      WORKER_DATABASE_URL: ""
    depends_on:
      role-provision:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      - ../tests:/app/tests
      - ../alembic:/app/alembic
      - ../scripts:/app/scripts
    networks:
      - rf_network

  # Apply the smallest current CRUD grants after the schema exists.
  # This intentionally does not change ownership or RLS.
  runtime-grants:
    image: postgres:16-alpine
    container_name: rf_runtime_grants
    restart: "no"
    command: ["sh", "/usr/local/bin/apply-runtime-grants.sh"]
    env_file:
      - ../.env
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-rf_db}
      RF_APP_PASSWORD: ""
      RF_WORKER_PASSWORD: ""
      RF_MIGRATOR_PASSWORD: ""
      API_DATABASE_URL: ""
      WORKER_DATABASE_URL: ""
      MIGRATOR_DATABASE_URL: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./postgres/apply-runtime-grants.sh:/usr/local/bin/apply-runtime-grants.sh:ro
    networks:
      - rf_network

  # ============================================================
  # Celery Worker - Batch Processing
  # ============================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: rf_worker
    restart: unless-stopped
    command: >
      sh -c "
      python scripts/wait_for_db.py &&
      celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
      "
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: rf_worker
      POSTGRES_PASSWORD: ${RF_WORKER_PASSWORD:?RF_WORKER_PASSWORD must be set}
      DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL must be set}
      RF_APP_PASSWORD: ""
      RF_WORKER_PASSWORD: ""
      RF_MIGRATOR_PASSWORD: ""
      API_DATABASE_URL: ""
      MIGRATOR_DATABASE_URL: ""
    depends_on:
      runtime-grants:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      - ../scripts:/app/scripts
    networks:
      - rf_network

  # ============================================================
  # Flower - Celery Monitoring
  # ============================================================
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: rf_flower
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: rf_app
      POSTGRES_PASSWORD: ${RF_APP_PASSWORD:?RF_APP_PASSWORD must be set}
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL must be set}
      RF_APP_PASSWORD: ""
      RF_WORKER_PASSWORD: ""
      RF_MIGRATOR_PASSWORD: ""
      WORKER_DATABASE_URL: ""
      MIGRATOR_DATABASE_URL: ""
    depends_on:
      - redis
      - runtime-grants
    networks:
      - rf_network


# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    name: rf_postgres_data
  redis_data:
    name: rf_redis_data
  seaweedfs_data:
    name: rf_seaweedfs_data


# ============================================================
# Networks
# ============================================================
networks:
  rf_network:
    name: rf_network
    driver: bridge
