# ============================================================
# ResumeFilter - Celery Worker Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-filter-worker
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-filter
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-filter
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Allow enough time for in-flight tasks to finish.
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: ghcr.io/your-username/resume-filter-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - |
              python scripts/wait_for_db.py && \
              celery -A app.workers.celery_app worker \
                --loglevel=info \
                --concurrency=4 \
                --max-tasks-per-child=1000 \
                --prefetch-multiplier=1
          envFrom:
            - configMapRef:
                name: resume-filter-config
            - secretRef:
                name: resume-filter-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resume-filter-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "celery -A app.workers.celery_app inspect ping -d celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "celery -A app.workers.celery_app inspect ping -d celery@$HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"