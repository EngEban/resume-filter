# ============================================================
# ResumeFilter - KEDA ScaledObject for Celery Workers
# ============================================================
# Requires KEDA to be installed in the cluster:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda --namespace keda --create-namespace
# ============================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: resume-filter-worker-scaler
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: resume-filter-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 4
              periodSeconds: 30
          selectPolicy: Max
  triggers:
    # Scale based on the default Celery queue length
    - type: redis
      metadata:
        address: resume-filter-redis.resume-filter.svc.cluster.local:6379
        listName: celery
        listLength: "10"
        activationListLength: "1"
      authenticationRef:
        name: keda-redis-auth
---
# KEDA trigger authentication for Redis
# Assumes Redis has no password (adjust if yours does).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-redis-auth
  namespace: resume-filter
spec:
  secretTargetRef:
    - parameter: password
      name: resume-filter-secrets
      key: REDIS_PASSWORD
    - parameter: enableTLS
      name: resume-filter-secrets
      key: REDIS_TLS