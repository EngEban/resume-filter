# ============================================================
# ResumeFilter - Ingress (nginx)
# ============================================================
# Prerequisites:
#   - An ingress controller (e.g., ingress-nginx)
#   - cert-manager for automatic TLS (optional)
#
# Replace `resume-filter.example.com` with your domain.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-filter
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: ingress
  annotations:
    # ---------- nginx-specific ----------
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"

    # ---------- WebSocket (NiceGUI) ----------
    nginx.ingress.kubernetes.io/websocket-services: "resume-filter-api"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"

    # ---------- TLS via cert-manager (optional) ----------
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # ---------- Security headers ----------
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - resume-filter.example.com
      secretName: resume-filter-tls
  rules:
    - host: resume-filter.example.com
      http:
        paths:
          # ---------- API + UI (same service) ----------
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-filter-api
                port:
                  number: 80