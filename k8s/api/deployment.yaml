# ============================================================
# ResumeFilter - API Deployment (FastAPI + NiceGUI)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-filter-api
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-filter
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-filter
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/your-username/resume-filter-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - |
              python scripts/wait_for_db.py && \
              gunicorn app.main:app \
                --worker-class uvicorn.workers.UvicornWorker \
                --workers 4 \
                --bind 0.0.0.0:8000 \
                --access-logfile - \
                --error-logfile - \
                --timeout 120 \
                --graceful-timeout 30 \
                --keep-alive 5
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: resume-filter-config
            - secretRef:
                name: resume-filter-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resume-filter-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"