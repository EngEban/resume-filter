# ============================================================
# ResumeFilter - API Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: resume-filter-api
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP