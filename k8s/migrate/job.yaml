# Run after resume-filter-role-provision succeeds and before runtime-grants.
apiVersion: batch/v1
kind: Job
metadata:
  name: resume-filter-migrate
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-filter
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/your-username/resume-filter-api:latest
          command: ["sh", "-c"]
          args:
            - python scripts/wait_for_db.py && alembic upgrade head
          envFrom:
            - configMapRef:
                name: resume-filter-config
            - secretRef:
                name: resume-filter-secrets
          env:
            - name: POSTGRES_USER
              value: "rf_migrator"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resume-filter-db-secrets
                  key: RF_MIGRATOR_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resume-filter-db-secrets
                  key: MIGRATOR_DATABASE_URL
