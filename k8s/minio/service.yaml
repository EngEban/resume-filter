# ============================================================
# ResumeFilter - MinIO Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: resume-filter-minio
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP