# ============================================================
# ResumeFilter - Non-sensitive Configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-filter-config
  namespace: resume-filter
  labels:
    app.kubernetes.io/name: resume-filter
    app.kubernetes.io/component: config
data:
  APP_NAME: "ResumeFilter"
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"

  POSTGRES_USER: "rf_user"
  POSTGRES_DB: "rf_db"
  POSTGRES_HOST: "resume-filter-postgres"
  POSTGRES_PORT: "5432"

  REDIS_URL: "redis://resume-filter-redis:6379/0"
  CELERY_BROKER_URL: "redis://resume-filter-redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://resume-filter-redis:6379/2"
  CELERY_CONCURRENCY: "4"

  S3_ENDPOINT: "resume-filter-minio:9000"
  S3_BUCKET: "resumes"
  S3_SECURE: "false"

  PLATFORM_LLM_PROVIDER: "groq"
  PLATFORM_LLM_MODEL: "groq/llama-3.1-8b-instant"

  B2C_DAILY_LIMIT: "3"
  B2C_PLATFORM_MONTHLY_LIMIT: "50"
  B2B_MAX_BATCH_SIZE: "500"
  B2B_MAX_FILE_SIZE_MB: "10"

  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_AUTH: "10/minute"
  RATE_LIMIT_B2C_ANALYZE: "5/minute"
  RATE_LIMIT_B2B_UPLOAD: "20/minute"
  RATE_LIMIT_DEFAULT: "120/minute"

  CORS_ORIGINS: "https://resume-filter.example.com"
  K8S_NAMESPACE: "resume-filter"
