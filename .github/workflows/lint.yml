# ============================================================
# Lint and type-check the codebase.
# ============================================================
name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Ruff + Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.7.4 mypy==1.13.0

      - name: Run Ruff (lint)
        run: ruff check app ui tests scripts

      - name: Run Ruff (format check)
        run: ruff format --check app ui tests scripts

      - name: Install project deps for mypy
        run: |
          pip install -r requirements.txt

      - name: Run Mypy
        run: mypy app ui
        continue-on-error: true