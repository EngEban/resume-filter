name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 1. Backend Tests (FastAPI + PostgreSQL + Redis)
  # ============================================
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rf_user
          POSTGRES_PASSWORD: rf_pass
          POSTGRES_DB: rf_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U rf_user; do sleep 1; done

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://rf_user:rf_pass@localhost:5432/rf_db
          SECRET_KEY: test-secret-key-for-ci-only-1234567890
          MASTER_KEY: 7rzkIN4xqmzkkUcsCkAK_J--_GKHQn66ypHBqFg9xrE=
        run: |
          alembic upgrade head

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://rf_user:rf_pass@localhost:5432/rf_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: test-secret-key-for-ci-only-1234567890
          MASTER_KEY: 7rzkIN4xqmzkkUcsCkAK_J--_GKHQn66ypHBqFg9xrE=
          PLATFORM_LLM_API_KEY: test-key
        run: |
          pytest tests/ -v --cov=app

      - name: Lint & Type Check (Ruff + Mypy)
        run: |
          ruff check app/ tests/
          mypy app/ --ignore-missing-imports

  # ============================================
  # 2. Frontend Tests (React + Vite)
  # ============================================
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ============================================
  # 3. Docker Build Verification
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: false
          tags: talentscope-api:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.ui
          push: false
          tags: talentscope-ui:ci